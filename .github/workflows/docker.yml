# Docker Build & Publish Workflow
#
# A reusable workflow for building Docker images with GitHub Container Registry (GHCR) support.
#
# Features:
#   - Sets up Docker Buildx for advanced build capabilities
#   - Authenticates with GitHub Container Registry (ghcr.io)
#   - Extracts and applies OCI metadata labels
#   - Supports build caching via GitHub Actions cache
#   - Conditionally publishes images based on input parameter
#   - Tags images with full commit SHA and `latest`
#
# Usage:
#   name: Build Docker Image
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#
#   jobs:
#     docker:
#       uses: evanpurkhiser/workflows/.github/workflows/docker.yml@main
#       with:
#         publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
#
# Inputs:
#   publish (boolean, required): Whether to push the built image to GHCR
#
# Requirements:
#   - A Dockerfile in the root directory
#   - GitHub Actions permissions to write packages (automatically granted for workflows in the same repository)
#
# Image Details:
#   - Published to: ghcr.io/<owner>/<repository>
#   - Tagged with: full commit SHA and `latest`
#   - Labeled with OCI standard metadata

name: docker
on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for image
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,prefix=,format=long
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ghcr.io/${{ github.repository }}:latest
          cache-to: type=gha,mode=max
          cache-from: type=gha
          annotations: ${{ steps.meta.outputs.annotations }}
          push: ${{ inputs.publish }}
