# Bump Homebrew Formula Workflow
#
# A reusable workflow for triggering a Homebrew formula bump in a tap repository
# via workflow_dispatch after a new release is published.
#
# Usage:
#   bump_homebrew:
#     uses: evanpurkhiser/workflows/.github/workflows/bump-homebrew.yml@main
#     with:
#       formula: my-tool
#       version: ${{ needs.release_meta.outputs.tag_name }}
#     secrets:
#       token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
#
# Inputs:
#   formula (string, required): The Homebrew formula name to bump (e.g. "things3-cloud")
#   version (string, required): The new version string, with or without a leading "v"
#
# Secrets:
#   token (required): A PAT with repo scope on the tap repository
#
# Requirements:
#   - The target tap repo must have a main.yml workflow with workflow_dispatch inputs
#     named "formula" and "version"

name: bump-homebrew
on:
  workflow_call:
    inputs:
      formula:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      token:
        required: true

jobs:
  bump:
    name: Bump
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch main workflow in homebrew-personal
        env:
          GH_TOKEN: ${{ secrets.token }}
          INPUTS_VERSION: ${{ inputs.version }}
          INPUTS_FORMULA: ${{ inputs.formula }}
        run: |
          VERSION="${INPUTS_VERSION}"
          VERSION="${VERSION#v}"
          gh workflow run main.yml \
            --repo evanpurkhiser/homebrew-personal \
            --ref main \
            -f formula="${INPUTS_FORMULA}" \
            -f version="${VERSION}"

          echo "Homebrew main workflow: https://github.com/evanpurkhiser/homebrew-personal/actions/workflows/main.yml" >> "$GITHUB_STEP_SUMMARY"
